<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintPrice OS — Book Price & Paper Materials Calculator</title>

  <!-- Google Fonts: Manrope (Primary) & Space Grotesk (Technical) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Unified PrintPrice OS Theme Initializer (Default: Dark, synced with Control Plane ppos-theme) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ppos-theme') || localStorage.getItem('theme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Compiled CSS with Tailwind -->
  <link rel="stylesheet" href="/index.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
</head>

<body class="bg-corporate-primary font-sans antialiased text-corporate-text">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root" class="min-h-screen flex flex-col"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
